    <p>您的成绩</p>
    <p style="font-size: 3em; font-weight: 600">{{ score }}<span style="font-size: .8em">分</span></p>
    {% if reason %}
    <p style="color: #d9534f">很遗憾，您的答卷未通过审核</p>

    {% endif %}
    <p>前往此页面进一步查询<b><a href="{{url}}">{{ url }}</a></b></p>
</div>
