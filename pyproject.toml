[project]
name = "fsp-exam-flask"
version = "0.2.2"
description = "Minecraft FSP Server Website Backend system"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "flask>=3.1.0",
    "flask-bcrypt==1.0.1",
    "flask-cors>=5.0.0",
    "flask-login==0.6.3",
    "flask-mail>=0.10.0",
    "flask-migrate>=4.1.0",
    "flask-sqlalchemy==3.1.1",
    "gunicorn>=26.0.0",
    "jsonschema>=4.26.0",
    "pillow==11.1.0",
    "pyjwt==2.10.1",
    "pymysql>=1.2.0",
    "python-dotenv==1.0.1",
    "requests==2.32.3",
    "sqlalchemy>=2.0.0",
    "toml==0.10.2",
]

[tool.ruff]
line-length = 120
select = [
    "F",
    "E",
    "W",
    "UP",
]
ignore = ["F401"]

[dependency-groups]
dev = [
    "ruff>=0.15.17",
]
